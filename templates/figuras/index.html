<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figuras — SamyVerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --brand: #FF6B35; --brand-dark: #e55a25; --brand-glow: rgba(255,107,53,.18);
      --bg: #080b11; --surface-1: #161b22; --surface-2: #1e2530; --surface-3: #262d3a;
      --border: rgba(255,255,255,.07); --border-hover: rgba(255,255,255,.13);
      --text-1: #f0f2f5; --text-2: #8b949e; --text-3: #4d5566;
      --success: #22c55e; --danger: #ef4444;
      --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
      --shadow-md: 0 4px 16px rgba(0,0,0,.5);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text-1); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,17,23,.88); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: .875rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; }
    .brand-icon {
      width: 36px; height: 36px; background: linear-gradient(135deg, var(--brand), #ff9a6c);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: .9rem; box-shadow: 0 2px 10px var(--brand-glow);
    }
    .brand-name { font-size: 1rem; font-weight: 700; color: var(--text-1); }
    #header-auth {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
      padding: .4rem 1rem; font-size: .82rem; color: var(--text-2);
      display: flex; align-items: center; gap: .5rem;
    }
    #header-auth a { text-decoration: none; }

    main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }

    .page-hero { margin-bottom: 1.75rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .page-hero h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; }
    .page-hero p  { color: var(--text-2); font-size: .9rem; margin-top: .25rem; }

    .btn-brand {
      background: var(--brand); border: none; color: #fff;
      padding: .6rem 1.25rem; border-radius: var(--r-md); font-weight: 600; font-size: .9rem;
      cursor: pointer; display: flex; align-items: center; gap: .4rem;
      transition: background .15s;
    }
    .btn-brand:hover { background: var(--brand-dark); }
    .btn-outline {
      background: transparent; border: 1px solid var(--border); color: var(--text-2);
      padding: .45rem .9rem; border-radius: var(--r-md); font-size: .82rem; cursor: pointer;
      transition: all .15s;
    }
    .btn-outline:hover { border-color: var(--border-hover); color: var(--text-1); }
    .btn-danger { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
    .btn-danger:hover { background: rgba(239,68,68,.25); }

    /* ── Tarjetas de figura ── */
    .figuras-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }
    .figura-card {
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: var(--r-lg); overflow: hidden; transition: border-color .15s, box-shadow .15s;
    }
    .figura-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
    .figura-card-img {
      width: 100%; height: 160px; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 3rem;
      overflow: hidden; position: relative;
    }
    .figura-card-img img { width: 100%; height: 100%; object-fit: cover; }
    /* ── Carrusel ── */
    .carousel { width: 100%; height: 100%; }
    .carousel-inner, .carousel-item { height: 100%; }
    .carousel-item img { width: 100%; height: 160px; object-fit: cover; }
    .carousel-control-prev, .carousel-control-next {
      width: 28px; opacity: 0; transition: opacity .15s;
    }
    .figura-card:hover .carousel-control-prev,
    .figura-card:hover .carousel-control-next { opacity: .8; }
    .carousel-control-prev-icon, .carousel-control-next-icon { width: 18px; height: 18px; }
    /* Carrusel detalle */
    .carousel-detalle .carousel-item img { height: 260px; object-fit: cover; border-radius: var(--r-md); }
    .carousel-detalle .carousel-indicators [data-bs-target] { background-color: var(--brand); }
    /* Descarga IA */
    .badge-ia {
      display: inline-block; background: var(--brand); color: #fff;
      font-size: .6rem; font-weight: 700; padding: 1px 5px; border-radius: 4px;
      vertical-align: middle; margin-left: .3rem;
    }
    .slide-download {
      position: absolute; bottom: 10px; right: 10px; z-index: 10;
      background: rgba(8,11,17,.72); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.15); color: #fff;
      border-radius: 8px; padding: .35rem .75rem;
      font-size: .78rem; font-weight: 600; text-decoration: none;
      display: inline-flex; align-items: center; gap: .35rem;
      transition: background .15s;
    }
    .slide-download:hover { background: var(--brand); color: #fff; border-color: var(--brand); }
    .figura-card-body { padding: 1.1rem 1.25rem; }
    .figura-card-name { font-size: 1rem; font-weight: 700; margin-bottom: .25rem; }
    .figura-card-desc { font-size: .8rem; color: var(--text-2); margin-bottom: .85rem; min-height: 1.2em; }
    .figura-stats {
      display: flex; gap: 1rem; margin-bottom: 1rem;
      padding: .7rem; background: var(--surface-2); border-radius: var(--r-md);
    }
    .stat { flex: 1; text-align: center; }
    .stat-val { font-size: .9rem; font-weight: 700; color: var(--brand); }
    .stat-lbl { font-size: .68rem; color: var(--text-3); margin-top: 2px; }
    .figura-card-actions { display: flex; gap: .5rem; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(8,11,17,.93); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 1rem;
    }
    .modal-box {
      background: var(--surface-1); border: 1px solid var(--border-hover);
      border-radius: var(--r-xl); padding: 1.75rem; width: 100%; max-width: 560px;
      box-shadow: 0 8px 40px rgba(0,0,0,.6); max-height: 90vh; overflow-y: auto;
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center; }
    .modal-close { background: none; border: none; color: var(--text-2); font-size: 1.3rem; cursor: pointer; }

    /* ── Formulario ── */
    .form-label { font-size: .8rem; color: var(--text-2); font-weight: 500; margin-bottom: .35rem; display: block; }
    .form-control, .form-select {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text-1); border-radius: var(--r-md); padding: .6rem .85rem; font-size: .9rem;
    }
    .form-control:focus, .form-select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-glow); }
    .form-control::placeholder { color: var(--text-3); }
    .form-select option { background: var(--surface-2); }

    /* ── Lista de piezas en modal ── */
    .piezas-list { margin-top: .75rem; display: flex; flex-direction: column; gap: .5rem; }
    .pieza-row {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md);
      padding: .65rem .85rem; display: flex; align-items: center; gap: .75rem;
    }
    .pieza-row-name { flex: 1; font-size: .85rem; font-weight: 500; }
    .pieza-row-precio { font-size: .8rem; color: var(--brand); font-weight: 600; }
    .pieza-row-qty { width: 70px; }
    .pieza-row-del { background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 1rem; }
    .pieza-row-del:hover { color: var(--danger); }

    /* ── Detalle (panel lateral) ── */
    #detalle-panel {
      position: fixed; top: 0; right: -420px; width: 420px; height: 100vh;
      background: var(--surface-1); border-left: 1px solid var(--border);
      padding: 1.5rem; overflow-y: auto; z-index: 200;
      transition: right .25s ease;
    }
    #detalle-panel.open { right: 0; }
    .detalle-cerrar { background: none; border: none; color: var(--text-2); font-size: 1.3rem; cursor: pointer; float: right; }

    .spin { animation: spin .7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert-danger { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.35); color: #fca5a5; border-radius: var(--r-md); padding: .75rem 1rem; font-size: .85rem; margin-bottom: 1rem; }
    .alert-success { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); color: #86efac; border-radius: var(--r-md); padding: .75rem 1rem; font-size: .85rem; margin-bottom: 1rem; }

    #empty-state { text-align: center; padding: 4rem 1rem; color: var(--text-3); }
    #empty-state i { font-size: 3rem; margin-bottom: 1rem; display: block; }
  </style>
</head>
<body>

<header>
  <a href="#" class="brand">
    <div class="brand-icon"><i class="bi bi-puzzle-fill"></i></div>
    <span class="brand-name">Figuras</span>
  </a>
  <div id="header-auth">
    <a href="#" onclick="mostrarLogin()" style="color:var(--brand);font-size:.85rem;font-weight:600">
      <i class="bi bi-person-circle me-1"></i>Iniciar sesión
    </a>
  </div>
</header>

<main>
  <div class="page-hero">
    <div>
      <h1><i class="bi bi-puzzle-fill me-2" style="color:var(--brand)"></i>Figuras</h1>
      <p>Conjuntos de piezas agrupadas con totales calculados automáticamente.</p>
    </div>
    <button class="btn-brand" onclick="abrirModalCrear()">
      <i class="bi bi-plus-lg"></i> Nueva figura
    </button>
  </div>

  <div id="msg-global" style="display:none"></div>

  <div id="figuras-grid" class="figuras-grid"></div>
  <div id="empty-state" style="display:none">
    <i class="bi bi-puzzle"></i>
    <p>Aún no hay figuras.<br>Crea la primera con el botón de arriba.</p>
  </div>
</main>

<!-- ═══ MODAL CREAR / EDITAR ═══ -->
<div id="modal-figura" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-title">
      <span id="modal-titulo">Nueva figura</span>
      <button class="modal-close" onclick="cerrarModal()"><i class="bi bi-x-lg"></i></button>
    </div>

    <div id="modal-carrusel" style="display:none;margin-bottom:1rem;border-radius:var(--r-md);overflow:hidden"></div>

    <div id="modal-error" class="alert-danger" style="display:none"></div>

    <div class="mb-3">
      <label class="form-label">Nombre *</label>
      <input id="f-nombre" type="text" class="form-control" placeholder="Ej: Set Mario Bros">
    </div>
    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea id="f-descripcion" class="form-control" rows="2" placeholder="Descripción opcional"></textarea>
    </div>

    <hr style="border-color:var(--border);margin:1.25rem 0">

    <div class="d-flex justify-content-between align-items-center mb-2">
      <span style="font-size:.85rem;font-weight:600">Piezas</span>
      <div style="display:flex;gap:.5rem;flex:1;margin-left:.75rem">
        <select id="f-pieza-sel" class="form-select" style="flex:1">
          <option value="">Seleccionar pieza...</option>
        </select>
        <input id="f-pieza-qty" type="text" inputmode="numeric" class="form-control" value="1" style="width:70px">
        <button class="btn-brand" onclick="agregarPiezaForm()" style="padding:.45rem .75rem;white-space:nowrap">
          <i class="bi bi-plus-lg"></i>
        </button>
      </div>
    </div>

    <div id="piezas-form-list" class="piezas-list"></div>

    <div style="margin-top:1.5rem;display:flex;gap:.75rem;justify-content:flex-end">
      <button class="btn-outline" onclick="cerrarModal()">Cancelar</button>
      <button id="btn-guardar-figura" class="btn-brand" onclick="guardarFigura()">
        <i class="bi bi-floppy me-1"></i>Guardar
      </button>
    </div>
  </div>
</div>

<!-- ═══ PANEL DETALLE ═══ -->
<div id="detalle-panel">
  <button class="detalle-cerrar" onclick="cerrarDetalle()"><i class="bi bi-x-lg"></i></button>
  <div id="detalle-content" style="margin-top:.5rem"></div>
</div>

<script>
  let accessToken  = localStorage.getItem('access')  || '';
  let refreshToken = localStorage.getItem('refresh') || '';
  const BASE = '';

  let piezasCatalogo = [];   // lista completa de piezas del catálogo
  let piezasEnForm   = [];   // [{pieza_id, nombre, precio, cantidad}]
  let editandoId     = null; // id de figura en edición

  // ── Arranque ────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', async () => {
    await detectarSesionAdmin();
    actualizarAuth();
    await Promise.all([cargarCatalogoPiezas(), cargarFiguras()]);
  });

  async function detectarSesionAdmin() {
    if (accessToken) return;
    try {
      const r = await fetch(`${BASE}/api/auth/token-session/`, { credentials: 'same-origin' });
      if (!r.ok) return;
      const d = await r.json();
      accessToken = d.access; refreshToken = d.refresh;
      localStorage.setItem('access', accessToken);
      localStorage.setItem('refresh', refreshToken);
      localStorage.setItem('username', d.username);
    } catch {}
  }

  function actualizarAuth() {
    const el = document.getElementById('header-auth');
    if (accessToken) {
      const u = localStorage.getItem('username') || 'usuario';
      el.innerHTML = `<i class="bi bi-person-circle"></i><span>${u}</span>
        <span style="color:var(--border-hover)">|</span>
        <a href="#" onclick="logout()" style="color:var(--text-2);text-decoration:none;font-size:.78rem">
          <i class="bi bi-box-arrow-right"></i> Salir</a>`;
    } else {
      el.innerHTML = `<a href="#" onclick="mostrarLogin()" style="color:var(--brand);font-size:.85rem;font-weight:600">
        <i class="bi bi-person-circle me-1"></i>Iniciar sesión</a>`;
    }
  }

  function mostrarLogin() { /* redirige al admin */ window.location.href = '/admin/'; }
  function logout() { localStorage.clear(); accessToken = refreshToken = ''; actualizarAuth(); }

  function authH() {
    const h = { 'Content-Type': 'application/json' };
    if (accessToken) h['Authorization'] = `Bearer ${accessToken}`;
    return h;
  }

  async function apiGet(url) {
    return fetch(url, { headers: authH() });
  }
  async function apiReq(method, url, body) {
    return fetch(url, { method, headers: authH(), body: body ? JSON.stringify(body) : undefined });
  }

  // ── Formato ─────────────────────────────────────────────────
  function cop(n) {
    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(n);
  }

  // ── Catálogo de piezas ───────────────────────────────────────
  async function cargarCatalogoPiezas() {
    if (!accessToken) return;
    try {
      const r = await apiGet(`${BASE}/api/v1/piezas/?page_size=500`);
      if (!r.ok) return;
      const d = await r.json();
      piezasCatalogo = d.results || d;
      const sel = document.getElementById('f-pieza-sel');
      sel.innerHTML = '<option value="">Seleccionar pieza...</option>' +
        piezasCatalogo.map(p =>
          `<option value="${p.id}" data-precio="${p.precio_venta_sugerido}" data-nombre="${p.nombre}">
            ${p.nombre} — ${cop(p.precio_venta_sugerido)}
           </option>`
        ).join('');
    } catch {}
  }

  // ── Listar figuras ───────────────────────────────────────────
  async function cargarFiguras() {
    const grid  = document.getElementById('figuras-grid');
    const empty = document.getElementById('empty-state');
    grid.innerHTML = `<div style="color:var(--text-3);grid-column:1/-1;text-align:center;padding:3rem">
      <i class="bi bi-arrow-repeat spin" style="font-size:2rem"></i></div>`;
    try {
      const r = await apiGet(`${BASE}/api/v1/figuras/?page_size=200`);
      if (!r.ok) throw new Error();
      const d = await r.json();
      const items = d.results || d;
      if (!items.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      grid.innerHTML = items.map(renderCard).join('');
      initCarousels(grid);
    } catch {
      grid.innerHTML = `<p style="color:var(--danger);grid-column:1/-1">Error cargando figuras.</p>`;
    }
  }

  function initCarousels(scope) {
    const run = () => {
      (scope || document).querySelectorAll('.carousel.slide').forEach(el => {
        if (!bootstrap.Carousel.getInstance(el)) {
          new bootstrap.Carousel(el, { ride: false, wrap: true });
        }
      });
    };
    if (typeof bootstrap !== 'undefined') {
      run();
    } else {
      document.addEventListener('bootstrapReady', run, { once: true });
    }
  }

  // conDownload=true agrega botón de descarga en cada slide (modo detalle)
  function renderCarrusel(imagenes, id, altura, conDownload, nombreBase) {
    const validas = (imagenes || []).filter(img => img.imagen);
    if (!validas.length) {
      return `<i class="bi bi-puzzle" style="font-size:3rem;color:var(--text-3)"></i>`;
    }
    const nombre = (nombreBase || 'figura').replace(/[^a-z0-9]/gi, '_').toLowerCase();
    const btnDl = (img, i) => conDownload
      ? `<a class="slide-download" href="${img.imagen}" download="${nombre}_ia_${i+1}.jpg">
           <i class="bi bi-download"></i> Descargar
         </a>`
      : '';

    if (validas.length === 1) {
      return `<div style="position:relative">
        <img src="${validas[0].imagen}" alt="imagen IA" style="width:100%;height:${altura}px;object-fit:cover">
        ${btnDl(validas[0], 1)}
      </div>`;
    }
    const items = validas.map((img, i) => `
      <div class="carousel-item ${i===0?'active':''}" style="position:relative">
        <img src="${img.imagen}" alt="imagen IA ${i+1}" style="width:100%;height:${altura}px;object-fit:cover">
        ${btnDl(img, i+1)}
      </div>`).join('');
    const indicators = validas.map((_, i) => `
      <button type="button" data-bs-target="#car-${id}" data-bs-slide-to="${i}"
        class="${i===0?'active':''}" aria-label="Imagen ${i+1}"></button>`).join('');
    return `
      <div id="car-${id}" class="carousel slide" data-bs-ride="false">
        <div class="carousel-indicators">${indicators}</div>
        <div class="carousel-inner">${items}</div>
        <button class="carousel-control-prev" type="button" data-bs-target="#car-${id}" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#car-${id}" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>`;
  }

  function renderCard(f) {
    const imgHtml = renderCarrusel(f.imagenes, `fig-${f.id}`, 160, false);
    return `
      <div class="figura-card" id="card-${f.id}">
        <div class="figura-card-img">${imgHtml}</div>
        <div class="figura-card-body">
          <div class="figura-card-name">${f.nombre}</div>
          <div class="figura-card-desc">${f.descripcion || '&nbsp;'}</div>
          <div class="figura-stats">
            <div class="stat"><div class="stat-val">${f.total_piezas}</div><div class="stat-lbl">Piezas</div></div>
            <div class="stat"><div class="stat-val">${cop(f.costo_total)}</div><div class="stat-lbl">Costo total</div></div>
            <div class="stat"><div class="stat-val">${cop(f.precio_total)}</div><div class="stat-lbl">Precio total</div></div>
          </div>
          <div class="figura-card-actions">
            <button class="btn-outline" style="flex:1" onclick="verDetalle(${f.id})">
              <i class="bi bi-eye me-1"></i>Ver
            </button>
            ${(f.imagenes||[]).filter(i=>i.imagen).length ? `
            <button class="btn-outline" style="flex:1;color:var(--brand);border-color:var(--brand)" onclick="verDetalle(${f.id})">
              <i class="bi bi-images me-1"></i>${(f.imagenes||[]).filter(i=>i.imagen).length} IA
            </button>` : ''}
            <button class="btn-outline" style="flex:1" onclick="abrirModalEditar(${f.id})">
              <i class="bi bi-pencil me-1"></i>Editar
            </button>
            <button class="btn-outline btn-danger" onclick="eliminarFigura(${f.id}, '${f.nombre.replace(/'/g,"\\'")}')">
              <i class="bi bi-trash3"></i>
            </button>
          </div>
        </div>
      </div>`;
  }

  // ── Modal crear/editar ───────────────────────────────────────
  function abrirModalCrear() {
    editandoId   = null;
    piezasEnForm = [];
    document.getElementById('modal-titulo').textContent = 'Nueva figura';
    document.getElementById('f-nombre').value       = '';
    document.getElementById('f-descripcion').value  = '';
    document.getElementById('modal-error').style.display = 'none';
    const carruselBox = document.getElementById('modal-carrusel');
    carruselBox.style.display = 'none';
    carruselBox.innerHTML = '';
    renderPiezasForm();
    document.getElementById('modal-figura').style.display = 'flex';
  }

  async function abrirModalEditar(id) {
    editandoId = id;
    document.getElementById('modal-error').style.display = 'none';
    const carruselBox = document.getElementById('modal-carrusel');
    carruselBox.style.display = 'none';
    carruselBox.innerHTML = '';
    try {
      const r = await apiGet(`${BASE}/api/v1/figuras/${id}/`);
      const f = await r.json();
      document.getElementById('modal-titulo').textContent = 'Editar figura';
      document.getElementById('f-nombre').value      = f.nombre;
      document.getElementById('f-descripcion').value = f.descripcion || '';
      piezasEnForm = (f.figura_piezas || []).map(fp => ({
        fp_id: fp.id, pieza_id: fp.pieza, nombre: fp.pieza_nombre,
        precio: fp.pieza_precio, cantidad: fp.cantidad,
      }));
      renderPiezasForm();

      const imagenesValidas = (f.imagenes || []).filter(img => img.imagen);
      if (imagenesValidas.length) {
        carruselBox.innerHTML = renderCarrusel(imagenesValidas, `mod-${f.id}`, 220, true, f.nombre);
        carruselBox.style.display = 'block';
        // Pequeño delay para que el DOM esté listo antes de inicializar Bootstrap
        setTimeout(() => initCarousels(carruselBox), 50);
      }

      document.getElementById('modal-figura').style.display = 'flex';
    } catch(e) {
      mostrarMsg('Error cargando figura: ' + (e.message || e), 'danger');
    }
  }

  function cerrarModal() {
    document.getElementById('modal-figura').style.display = 'none';
  }

  function agregarPiezaForm() {
    const sel = document.getElementById('f-pieza-sel');
    const qty = parseInt(document.getElementById('f-pieza-qty').value) || 1;
    if (!sel.value) return;
    const opt = sel.options[sel.selectedIndex];
    const ya  = piezasEnForm.find(p => p.pieza_id == sel.value);
    if (ya) { ya.cantidad += qty; }
    else {
      piezasEnForm.push({
        fp_id: null, pieza_id: parseInt(sel.value),
        nombre: opt.dataset.nombre,
        precio: parseFloat(opt.dataset.precio),
        cantidad: qty,
      });
    }
    sel.value = '';
    document.getElementById('f-pieza-qty').value = '1';
    renderPiezasForm();
  }

  function quitarPiezaForm(idx) {
    piezasEnForm.splice(idx, 1);
    renderPiezasForm();
  }

  function renderPiezasForm() {
    const el = document.getElementById('piezas-form-list');
    if (!piezasEnForm.length) {
      el.innerHTML = `<p style="color:var(--text-3);font-size:.8rem;text-align:center;padding:.5rem 0">Sin piezas agregadas</p>`;
      return;
    }
    el.innerHTML = piezasEnForm.map((p, i) => `
      <div class="pieza-row">
        <span class="pieza-row-name">${p.nombre}</span>
        <span class="pieza-row-precio">${cop(p.precio)}</span>
        <input type="text" inputmode="numeric" class="form-control pieza-row-qty" value="${p.cantidad}"
          onchange="piezasEnForm[${i}].cantidad = parseInt(this.value)||1; renderPiezasForm()">
        <button class="pieza-row-del" onclick="quitarPiezaForm(${i})"><i class="bi bi-x-circle"></i></button>
      </div>`).join('');
  }

  async function guardarFigura() {
    const nombre = document.getElementById('f-nombre').value.trim();
    const errEl  = document.getElementById('modal-error');
    errEl.style.display = 'none';
    if (!nombre) { errEl.textContent = 'El nombre es obligatorio.'; errEl.style.display = 'block'; return; }

    const btn = document.getElementById('btn-guardar-figura');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin me-1"></i>Guardando...';

    try {
      const body   = { nombre, descripcion: document.getElementById('f-descripcion').value };
      const method = editandoId ? 'PUT' : 'POST';
      const url    = editandoId ? `${BASE}/api/v1/figuras/${editandoId}/` : `${BASE}/api/v1/figuras/`;
      const r = await apiReq(method, url, body);
      if (!r.ok) { const e = await r.json(); throw new Error(JSON.stringify(e)); }
      const figura = await r.json();
      const figId  = figura.id;

      // Sincronizar piezas: eliminar las que ya no están, crear las nuevas/modificadas
      if (editandoId) {
        const rExist = await apiGet(`${BASE}/api/v1/figura-piezas/?figura=${figId}`);
        const exist  = await rExist.json();
        const existList = exist.results || exist;
        // Borrar las que quitamos
        for (const fp of existList) {
          if (!piezasEnForm.find(p => p.pieza_id === fp.pieza)) {
            await apiReq('DELETE', `${BASE}/api/v1/figura-piezas/${fp.id}/`);
          }
        }
        // Actualizar/crear las del form
        for (const p of piezasEnForm) {
          const existFp = existList.find(fp => fp.pieza === p.pieza_id);
          if (existFp) {
            await apiReq('PATCH', `${BASE}/api/v1/figura-piezas/${existFp.id}/`, { cantidad: p.cantidad });
          } else {
            await apiReq('POST', `${BASE}/api/v1/figura-piezas/`, { figura: figId, pieza: p.pieza_id, cantidad: p.cantidad });
          }
        }
      } else {
        for (const p of piezasEnForm) {
          await apiReq('POST', `${BASE}/api/v1/figura-piezas/`, { figura: figId, pieza: p.pieza_id, cantidad: p.cantidad });
        }
      }

      cerrarModal();
      cargarFiguras();
      mostrarMsg(`Figura "${nombre}" guardada correctamente.`, 'success');
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-floppy me-1"></i>Guardar';
    }
  }

  // ── Eliminar ─────────────────────────────────────────────────
  async function eliminarFigura(id, nombre) {
    if (!confirm(`¿Eliminar la figura "${nombre}"? Esta acción no se puede deshacer.`)) return;
    try {
      const r = await apiReq('DELETE', `${BASE}/api/v1/figuras/${id}/`);
      if (!r.ok) throw new Error();
      cargarFiguras();
      mostrarMsg(`Figura "${nombre}" eliminada.`, 'success');
    } catch {
      mostrarMsg('Error al eliminar la figura.', 'danger');
    }
  }

  // ── Detalle ──────────────────────────────────────────────────
  async function verDetalle(id) {
    const panel = document.getElementById('detalle-panel');
    const cont  = document.getElementById('detalle-content');
    cont.innerHTML = `<p style="color:var(--text-3)"><i class="bi bi-arrow-repeat spin"></i> Cargando...</p>`;
    panel.classList.add('open');
    try {
      const r = await apiGet(`${BASE}/api/v1/figuras/${id}/`);
      const f = await r.json();
      const piezasHtml = (f.figura_piezas || []).map(fp => `
        <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem;margin-bottom:.5rem;">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:600;font-size:.88rem">${fp.pieza_nombre}</span>
            <span style="font-size:.8rem;color:var(--text-2)">× ${fp.cantidad}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:.35rem;font-size:.78rem;color:var(--text-2)">
            <span>Precio unit: <strong style="color:var(--brand)">${cop(fp.pieza_precio)}</strong></span>
            <span>Subtotal: <strong style="color:var(--brand)">${cop(fp.subtotal_precio)}</strong></span>
          </div>
        </div>`).join('');

      const imagenesValidas = (f.imagenes || []).filter(img => img.imagen);
      const nombreBase = f.nombre.replace(/[^a-z0-9]/gi,'_').toLowerCase();

      const carruselDetalle = imagenesValidas.length
        ? `<div class="carousel-detalle" style="border-radius:var(--r-md);overflow:hidden">
             ${renderCarrusel(imagenesValidas, `det-${f.id}`, 260, false, f.nombre)}
           </div>`
        : '';

      const descargaSeccion = imagenesValidas.length ? `
        <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:.85rem 1rem;margin:.75rem 0">
          <p style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:.5rem">
            <i class="bi bi-images me-1" style="color:var(--brand)"></i>Imágenes IA — Descargar
          </p>
          <a href="${BASE}/api/v1/figuras/${f.id}/descargar-imagenes-ia/"
             style="display:inline-flex;align-items:center;gap:.4rem;
                    background:var(--brand);color:#fff;border-radius:var(--r-md);
                    padding:.45rem 1rem;font-size:.82rem;font-weight:700;
                    text-decoration:none;margin-bottom:.5rem;width:100%;justify-content:center">
            <i class="bi bi-file-earmark-zip-fill"></i>
            Descargar todas (${imagenesValidas.length} imágenes) — ZIP
          </a>
          <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem">
            ${imagenesValidas.map((img,i) => `
              <a href="${img.imagen}" download="${nombreBase}_ia_${i+1}.jpg"
                 style="display:inline-flex;align-items:center;gap:.3rem;background:var(--surface-3);
                        border:1px solid var(--border);border-radius:6px;padding:.35rem .7rem;
                        color:var(--text-1);text-decoration:none;font-size:.78rem;font-weight:500">
                <i class="bi bi-download" style="color:var(--brand)"></i> Imagen ${i+1}
              </a>`).join('')}
          </div>
        </div>` : '';

      cont.innerHTML = `
        ${carruselDetalle}
        ${descargaSeccion}
        <h2 style="font-size:1.15rem;font-weight:800;margin-bottom:.35rem">${f.nombre}</h2>
        ${f.descripcion ? `<p style="color:var(--text-2);font-size:.85rem;margin-bottom:1rem">${f.descripcion}</p>` : ''}
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;margin-bottom:1.25rem">
          <div style="background:var(--surface-2);border-radius:10px;padding:.75rem;text-align:center">
            <div style="font-size:1.1rem;font-weight:700;color:var(--brand)">${f.total_piezas}</div>
            <div style="font-size:.7rem;color:var(--text-3)">Piezas</div>
          </div>
          <div style="background:var(--surface-2);border-radius:10px;padding:.75rem;text-align:center">
            <div style="font-size:.85rem;font-weight:700;color:var(--brand)">${cop(f.costo_total)}</div>
            <div style="font-size:.7rem;color:var(--text-3)">Costo total</div>
          </div>
          <div style="background:var(--surface-2);border-radius:10px;padding:.75rem;text-align:center">
            <div style="font-size:.85rem;font-weight:700;color:var(--brand)">${cop(f.precio_total)}</div>
            <div style="font-size:.7rem;color:var(--text-3)">Precio total</div>
          </div>
        </div>
        <p style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:.5rem">Piezas incluidas</p>
        ${piezasHtml || '<p style="color:var(--text-3);font-size:.82rem">Sin piezas.</p>'}
        <div style="margin-top:1.25rem;display:flex;gap:.5rem">
          <button class="btn-brand" style="flex:1" onclick="abrirModalEditar(${f.id})">
            <i class="bi bi-pencil me-1"></i>Editar
          </button>
          <button class="btn-outline btn-danger" onclick="eliminarFigura(${f.id},'${f.nombre.replace(/'/g,"\\'")}')">
            <i class="bi bi-trash3"></i>
          </button>
        </div>`;
      setTimeout(() => initCarousels(cont), 50);
    } catch {
      cont.innerHTML = `<p style="color:var(--danger)">Error cargando detalle.</p>`;
    }
  }

  function cerrarDetalle() {
    document.getElementById('detalle-panel').classList.remove('open');
  }

  // ── Mensajes ─────────────────────────────────────────────────
  function mostrarMsg(txt, tipo) {
    const el = document.getElementById('msg-global');
    el.className = tipo === 'danger' ? 'alert-danger' : 'alert-success';
    el.textContent = txt;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        onload="document.dispatchEvent(new Event('bootstrapReady'))"></script>
</body>
</html>
