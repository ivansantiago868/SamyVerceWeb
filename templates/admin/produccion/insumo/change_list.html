{% extends "admin/change_list.html" %}
{% load i18n %}

{% block extrahead %}
{{ block.super }}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
{% endblock %}

{% block object-tools %}
{{ block.super }}
{{ tipos_chart|json_script:"tipos-data" }}
<div style="display:flex;flex-direction:column;gap:20px;margin:16px 0;">
  <div style="background:var(--body-bg,#fff);border:1px solid var(--hairline-color,#ddd);border-radius:8px;padding:16px;">
    <h2 style="font-size:13px;margin:0 0 12px;text-transform:uppercase;color:var(--body-quiet-color,#666);">Gramos disponibles por tipo de material</h2>
    <div style="position:relative;width:100%;height:400px;">
      <canvas id="chart-insumo-tipos"></canvas>
    </div>
  </div>
</div>
<script>
(function () {
  function render() {
    var tipos = JSON.parse(document.getElementById("tipos-data").textContent);

    new Chart(document.getElementById("chart-insumo-tipos"), {
      type: "bar",
      data: {
        labels: tipos.tipos,
        datasets: tipos.series.map(function (s) {
          return {
            label: s.label,
            data: s.data,
            backgroundColor: s.color,
            borderColor: "#999",
            borderWidth: 1,
          };
        }),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: "bottom" },
          tooltip: { callbacks: { label: function (ctx) { return ctx.dataset.label + ": " + ctx.parsed.y + " g"; } } },
        },
        scales: {
          x: {},
          y: { beginAtZero: true },
        },
      },
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", render);
  } else {
    render();
  }
})();
</script>
{% endblock %}
