<div class="drag-drop-wrapper">

  {% if widget.value %}
  <div class="drag-drop-existing">
    Archivo actual:
    <a href="{{ widget.value.url }}" target="_blank" rel="noopener">{{ widget.value }}</a>
  </div>
  {% endif %}

  <div class="drag-drop-zone" style="{% if widget.value %}display:none{% endif %}">
    <div class="drag-drop-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
    </div>
    <div class="drag-drop-label">
      Arrastra tu archivo aquí o <strong>selecciona uno</strong>
    </div>
    <div class="drag-drop-hint">Formato: .3mf</div>
    <input type="file"
           name="{{ widget.name }}"
           class="drag-drop-input"
           accept=".3mf"
           aria-label="Seleccionar archivo 3MF"
           {% if widget.attrs.required %}required{% endif %}>
  </div>

  <div class="drag-drop-preview" style="display:{% if widget.value %}flex{% else %}none{% endif %}">
    <span class="drag-drop-preview-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
    </span>
    <span class="drag-drop-preview-name">{% if widget.value %}{{ widget.value }}{% endif %}</span>
    <button type="button" class="drag-drop-clear"
            aria-label="Quitar archivo">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  {% if widget.is_initial and not widget.required %}
  <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}" style="display:none">
  {% endif %}

</div>
