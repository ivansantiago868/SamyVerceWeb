<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador 3D</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary: #FF6B35;
      --primary-dark: #e55a25;
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232636;
      --border: #2e3147;
      --text: #e8e9f0;
      --muted: #7b7f96;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Login overlay ── */
    #login-overlay {
      position: fixed; inset: 0;
      background: rgba(15,17,23,.97);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%; max-width: 380px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
    }
    .login-card .logo {
      font-size: 2.2rem; font-weight: 800;
      color: var(--primary); letter-spacing: -1px;
      margin-bottom: .25rem;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: .9rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
    .badge-user {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .3rem .85rem;
      font-size: .8rem; color: var(--muted);
      display: flex; align-items: center; gap: .4rem;
    }

    /* ── Layout ── */
    main { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }

    /* ── Mode tabs ── */
    .mode-tabs {
      display: grid; grid-template-columns: repeat(2,1fr);
      gap: .6rem; margin-bottom: 2rem;
    }
    @media(min-width:600px){ .mode-tabs { grid-template-columns: repeat(4,1fr); } }
    .mode-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .85rem .75rem;
      cursor: pointer; text-align: center;
      transition: all .15s;
      color: var(--muted);
    }
    .mode-tab:hover { border-color: var(--primary); color: var(--text); }
    .mode-tab.active {
      background: var(--primary); border-color: var(--primary);
      color: #fff; font-weight: 600;
    }
    .mode-tab i { font-size: 1.4rem; display: block; margin-bottom: .35rem; }

    /* ── Card ── */
    .card-dark {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
    }

    /* ── Inputs ── */
    .form-label { color: var(--muted); font-size: .82rem; font-weight: 500; margin-bottom: .35rem; }
    .form-control, .form-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
    }
    .form-control:focus, .form-select:focus {
      background: var(--surface2);
      border-color: var(--primary);
      color: var(--text);
      box-shadow: 0 0 0 3px rgba(255,107,53,.15);
    }
    .form-control::placeholder { color: var(--muted); }
    .form-select option { background: var(--surface2); }

    /* ── Button ── */
    .btn-primary-custom {
      background: var(--primary); border: none; color: #fff;
      border-radius: 10px; padding: .7rem 2rem;
      font-weight: 600; font-size: 1rem;
      transition: background .15s;
      width: 100%;
    }
    .btn-primary-custom:hover { background: var(--primary-dark); }
    .btn-primary-custom:disabled { opacity: .6; cursor: not-allowed; }

    /* ── Result panel ── */
    #result-panel {
      margin-top: 2rem;
      display: none;
    }
    .result-title {
      font-size: 1rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .08em;
      margin-bottom: 1.25rem;
    }
    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: .75rem;
    }
    .result-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }
    .result-item.highlight {
      border-color: var(--primary);
      background: rgba(255,107,53,.08);
    }
    .result-item .label {
      font-size: .75rem; color: var(--muted); margin-bottom: .3rem;
    }
    .result-item .value {
      font-size: 1.25rem; font-weight: 700; color: var(--text);
    }
    .result-item.highlight .value { color: var(--primary); }

    /* ── Error / success alerts ── */
    .alert-dark-danger {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.35);
      color: #fca5a5; border-radius: 10px; padding: .85rem 1rem;
      font-size: .9rem;
    }
    .alert-dark-info {
      background: rgba(99,102,241,.12);
      border: 1px solid rgba(99,102,241,.3);
      color: #a5b4fc; border-radius: 10px; padding: .85rem 1rem;
      font-size: .85rem;
    }

    /* ── Spinner ── */
    .spin { animation: spin .7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Separator ── */
    hr.dark { border-color: var(--border); margin: 1.5rem 0; }
  </style>
</head>
<body>

<!-- ═══════════════════ LOGIN MODAL ═══════════════════ -->
<div id="login-overlay" style="display:none">
  <div class="login-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
      <div class="logo" style="margin-bottom:0"><i class="bi bi-printer-fill"></i> 3D</div>
      <button onclick="cerrarLogin()" style="background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <p style="color:var(--muted);font-size:.9rem;margin-bottom:1.25rem">Inicia sesión para guardar piezas en el inventario</p>

    <div id="login-error" class="alert-dark-danger mb-3" style="display:none"></div>

    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input id="inp-username" type="text" class="form-control" placeholder="usuario">
    </div>
    <div class="mb-4">
      <label class="form-label">Contraseña</label>
      <input id="inp-password" type="password" class="form-control" placeholder="••••••••">
    </div>
    <button id="btn-login" class="btn-primary-custom" onclick="login()">
      Ingresar
    </button>
  </div>
</div>

<!-- ═══════════════════ APP ═══════════════════ -->
<header>
  <span class="brand"><i class="bi bi-printer-fill me-2"></i>Cotizador 3D</span>
  <div class="badge-user" id="header-auth">
    <a href="#" onclick="mostrarLogin()" style="color:var(--primary);text-decoration:none;font-size:.85rem;font-weight:600">
      <i class="bi bi-person-circle me-1"></i>Iniciar sesión
    </a>
  </div>
</header>

<main>

  <!-- Tabs de modo -->
  <div class="mode-tabs">
    <div class="mode-tab active" onclick="setMode('nueva')" id="tab-nueva">
      <i class="bi bi-plus-circle"></i>
      Pieza nueva
    </div>
    <div class="mode-tab" onclick="setMode('lote')" id="tab-lote">
      <i class="bi bi-stack"></i>
      Pieza × lote
    </div>
    <div class="mode-tab" onclick="setMode('catalogo')" id="tab-catalogo">
      <i class="bi bi-archive"></i>
      Del catálogo
    </div>
    <div class="mode-tab" onclick="setMode('catalogo-lote')" id="tab-catalogo-lote">
      <i class="bi bi-layers"></i>
      Catálogo × lote
    </div>
  </div>

  <!-- Formulario -->
  <div class="card-dark">

    <!-- Campos comunes: pieza nueva -->
    <div id="fields-nueva">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Nombre de la pieza</label>
          <input id="f-nombre" type="text" class="form-control" placeholder="Ej: Soporte de cámara">
        </div>
        <div class="col-sm-6">
          <label class="form-label">Peso (gramos)</label>
          <input id="f-peso" type="number" class="form-control" placeholder="45" min="0.1" step="0.1">
        </div>
        <div class="col-sm-6">
          <label class="form-label">Tiempo impresión (horas)</label>
          <input id="f-tiempo" type="number" class="form-control" placeholder="2.5" min="0.01" step="0.01">
        </div>
        <div class="col-sm-6">
          <label class="form-label">Tiempo post-procesado (horas)</label>
          <input id="f-postproceso" type="number" class="form-control" value="0" min="0" step="0.01">
        </div>
        <div class="col-sm-6 d-flex align-items-center gap-3 pt-3">
          <input id="f-empaque" type="checkbox" class="form-check-input mt-0" style="width:1.3rem;height:1.3rem;cursor:pointer">
          <label class="form-label mb-0" for="f-empaque">
            Incluir empaque
            <span style="color:var(--muted);font-size:.75rem;display:block">precio de Variables Fijas</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Campo extra: cantidad (lote) -->
    <div id="fields-lote" style="display:none">
      <hr class="dark">
      <div class="col-sm-6">
        <label class="form-label">Cantidad de piezas</label>
        <input id="f-cantidad" type="number" class="form-control" placeholder="10" min="1" step="1">
      </div>
    </div>

    <!-- Campos catálogo -->
    <div id="fields-catalogo" style="display:none">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Pieza del catálogo</label>
          <select id="f-pieza-id" class="form-select">
            <option value="">Cargando...</option>
          </select>
        </div>
        <div class="col-sm-6">
          <label class="form-label">Tiempo post-procesado (horas)</label>
          <input id="f-cat-postproceso" type="number" class="form-control" value="0" min="0" step="0.01">
        </div>
        <div class="col-sm-6 d-flex align-items-center gap-3 pt-3">
          <input id="f-cat-empaque" type="checkbox" class="form-check-input mt-0" style="width:1.3rem;height:1.3rem;cursor:pointer">
          <label class="form-label mb-0" for="f-cat-empaque">
            Incluir empaque
            <span style="color:var(--muted);font-size:.75rem;display:block">precio de Variables Fijas</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Campo cantidad catálogo lote -->
    <div id="fields-catalogo-lote" style="display:none">
      <hr class="dark">
      <div class="col-sm-6">
        <label class="form-label">Cantidad de piezas</label>
        <input id="f-cat-cantidad" type="number" class="form-control" placeholder="10" min="1" step="1">
      </div>
    </div>

    <hr class="dark">

    <div id="form-error" class="alert-dark-danger mb-3" style="display:none"></div>

    <button id="btn-cotizar" class="btn-primary-custom" onclick="cotizar()">
      <i class="bi bi-calculator me-2"></i>Calcular precio
    </button>
  </div>

  <!-- Panel de resultados -->
  <div id="result-panel" class="card-dark">
    <div class="result-title"><i class="bi bi-bar-chart-line me-2"></i>Resultado</div>
    <div id="result-grid" class="result-grid"></div>

    <div id="catalogo-diff" style="display:none; margin-top:1rem;">
      <hr class="dark">
      <div class="alert-dark-info" id="catalogo-diff-text"></div>
    </div>

    <hr class="dark">

    <div id="save-feedback" style="display:none; margin-bottom:.75rem;"></div>
    <button id="btn-guardar" class="btn-primary-custom" style="background:var(--success)" onclick="guardarEnInventario()">
      <i class="bi bi-floppy me-2"></i>Guardar en piezas
    </button>
    <p id="save-login-hint" style="display:none;text-align:center;margin-top:.6rem;font-size:.82rem;color:var(--muted)">
      <a href="#" onclick="mostrarLogin()" style="color:var(--primary)">Inicia sesión</a> para guardar en el inventario
    </p>
  </div>

</main>

<script>
  // ── Estado ──────────────────────────────────────────────
  let accessToken  = localStorage.getItem('access')  || '';
  let refreshToken = localStorage.getItem('refresh') || '';
  let currentMode  = 'nueva';
  let lastResult   = null;

  const BASE = '';   // mismo origen

  // ── Arranque ─────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', async () => {
    await detectarSesionAdmin();
    actualizarEstadoAuth();
    cargarCatalogo();
    document.getElementById('inp-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  });

  async function detectarSesionAdmin() {
    if (accessToken) return;          // ya tiene token JWT
    try {
      const res = await fetch(`${BASE}/api/auth/token-session/`, {
        credentials: 'same-origin',   // envía la cookie de sesión del admin
      });
      if (!res.ok) return;
      const data   = await res.json();
      accessToken  = data.access;
      refreshToken = data.refresh;
      localStorage.setItem('access',   accessToken);
      localStorage.setItem('refresh',  refreshToken);
      localStorage.setItem('username', data.username);
    } catch { /* sin sesión admin, continuar como anónimo */ }
  }

  function mostrarLogin() {
    document.getElementById('login-overlay').style.display = 'flex';
  }

  function cerrarLogin() {
    document.getElementById('login-overlay').style.display = 'none';
  }

  function actualizarEstadoAuth() {
    const logueado = !!accessToken;
    const headerAuth = document.getElementById('header-auth');
    const btnGuardar = document.getElementById('btn-guardar');
    const hint       = document.getElementById('save-login-hint');

    if (logueado) {
      const user = localStorage.getItem('username') || 'usuario';
      headerAuth.innerHTML =
        `<i class="bi bi-person-circle"></i>
         <span>${user}</span>
         <span style="color:var(--border)">|</span>
         <a href="#" onclick="logout()" style="color:var(--muted);text-decoration:none;font-size:.78rem">
           <i class="bi bi-box-arrow-right"></i> Salir
         </a>`;
    } else {
      headerAuth.innerHTML =
        `<a href="#" onclick="mostrarLogin()" style="color:var(--primary);text-decoration:none;font-size:.85rem;font-weight:600">
           <i class="bi bi-person-circle me-1"></i>Iniciar sesión
         </a>`;
    }

    if (btnGuardar) {
      btnGuardar.disabled = !logueado;
      if (hint) hint.style.display = logueado ? 'none' : 'block';
    }
  }

  // ── Autenticación ────────────────────────────────────────
  async function login() {
    const username = document.getElementById('inp-username').value.trim();
    const password = document.getElementById('inp-password').value;
    const errEl    = document.getElementById('login-error');
    const btn      = document.getElementById('btn-login');

    errEl.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin me-2"></i>Ingresando...';

    try {
      const res = await fetch(`${BASE}/api/auth/token/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Credenciales incorrectas');

      accessToken  = data.access;
      refreshToken = data.refresh;
      localStorage.setItem('access',   accessToken);
      localStorage.setItem('refresh',  refreshToken);
      localStorage.setItem('username', username);
      cerrarLogin();
      actualizarEstadoAuth();
    } catch (e) {
      errEl.textContent    = e.message;
      errEl.style.display  = 'block';
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Ingresar';
    }
  }

  function logout() {
    localStorage.clear();
    accessToken = refreshToken = '';
    actualizarEstadoAuth();
  }

  function authHeaders(extra = {}) {
    const h = { 'Content-Type': 'application/json', ...extra };
    if (accessToken) h['Authorization'] = `Bearer ${accessToken}`;
    return h;
  }

  async function refrescarToken() {
    if (!refreshToken) throw new Error('no_session');
    const res = await fetch(`${BASE}/api/auth/token/refresh/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh: refreshToken }),
    });
    if (!res.ok) { logout(); throw new Error('Sesión expirada'); }
    const data  = await res.json();
    accessToken = data.access;
    localStorage.setItem('access', accessToken);
  }

  async function apiFetch(url, body) {
    let res = await fetch(url, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify(body),
    });
    if (res.status === 401 && refreshToken) {
      try {
        await refrescarToken();
        res = await fetch(url, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify(body),
        });
      } catch (e) {
        if (e.message === 'no_session') throw new Error('Debes iniciar sesión');
        throw e;
      }
    }
    return res;
  }

  async function apiGet(url) {
    let res = await fetch(url, { headers: authHeaders() });
    if (res.status === 401 && refreshToken) {
      try {
        await refrescarToken();
        res = await fetch(url, { headers: authHeaders() });
      } catch { /* sin sesión, devolver respuesta original */ }
    }
    return res;
  }


  // ── Modos ────────────────────────────────────────────────
  function setMode(mode) {
    currentMode = mode;
    ['nueva','lote','catalogo','catalogo-lote'].forEach(m => {
      document.getElementById(`tab-${m}`).classList.toggle('active', m === mode);
    });

    const isCat = mode.includes('catalogo');
    const isLot = mode.includes('lote');

    document.getElementById('fields-nueva').style.display    = isCat ? 'none' : 'block';
    document.getElementById('fields-lote').style.display     = (!isCat && isLot) ? 'block' : 'none';
    document.getElementById('fields-catalogo').style.display = isCat ? 'block' : 'none';
    document.getElementById('fields-catalogo-lote').style.display = (isCat && isLot) ? 'block' : 'none';

    document.getElementById('result-panel').style.display = 'none';
    document.getElementById('form-error').style.display   = 'none';
  }

  // ── Catálogo ─────────────────────────────────────────────
  async function cargarCatalogo() {
    const sel = document.getElementById('f-pieza-id');
    if (!accessToken) {
      sel.innerHTML = '<option value="">Inicia sesión para ver el catálogo</option>';
      return;
    }
    try {
      const res   = await apiGet(`${BASE}/api/v1/piezas/?page_size=200`);
      if (!res.ok) { sel.innerHTML = '<option value="">Sin acceso al catálogo</option>'; return; }
      const data  = await res.json();
      const items = data.results || data;
      sel.innerHTML = items.length
        ? items.map(p => `<option value="${p.id}">${p.nombre} (${p.peso_gramos}g)</option>`).join('')
        : '<option value="">Sin piezas en catálogo</option>';
    } catch {
      sel.innerHTML = '<option value="">Error cargando catálogo</option>';
    }
  }

  // ── Cotizar ──────────────────────────────────────────────
  async function cotizar() {
    const errEl = document.getElementById('form-error');
    const btn   = document.getElementById('btn-cotizar');
    errEl.style.display = 'none';

    let url, body;

    if (currentMode === 'nueva' || currentMode === 'lote') {
      const nombre  = document.getElementById('f-nombre').value.trim();
      const peso    = parseFloat(document.getElementById('f-peso').value);
      const tiempo  = parseFloat(document.getElementById('f-tiempo').value);
      const post    = parseFloat(document.getElementById('f-postproceso').value) || 0;
      const empaque = document.getElementById('f-empaque').checked ? 1 : 0;

      if (!nombre)         return showErr('Ingresa el nombre de la pieza.');
      if (isNaN(peso))     return showErr('Ingresa el peso en gramos.');
      if (isNaN(tiempo))   return showErr('Ingresa el tiempo de impresión.');

      body = { nombre_pieza: nombre, peso_gramos: peso,
               tiempo_impresion_horas: tiempo,
               tiempo_postproceso_horas: post, costo_empaque_override: empaque };

      if (currentMode === 'lote') {
        const cant = parseInt(document.getElementById('f-cantidad').value);
        if (isNaN(cant) || cant < 1) return showErr('Ingresa una cantidad válida.');
        body.cantidad = cant;
        url = `${BASE}/api/v1/cotizador/lote/`;
      } else {
        url = `${BASE}/api/v1/cotizador/`;
      }
    } else {
      const piezaId = document.getElementById('f-pieza-id').value;
      const post    = parseFloat(document.getElementById('f-cat-postproceso').value) || 0;
      const empaque = document.getElementById('f-cat-empaque').checked ? 1 : 0;

      if (!piezaId) return showErr('Selecciona una pieza del catálogo.');

      body = { pieza_id: parseInt(piezaId),
               tiempo_postproceso_horas: post, costo_empaque_override: empaque };

      if (currentMode === 'catalogo-lote') {
        const cant = parseInt(document.getElementById('f-cat-cantidad').value);
        if (isNaN(cant) || cant < 1) return showErr('Ingresa una cantidad válida.');
        body.cantidad = cant;
        url = `${BASE}/api/v1/cotizador/desde-catalogo/lote/`;
      } else {
        url = `${BASE}/api/v1/cotizador/desde-catalogo/`;
      }
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin me-2"></i>Calculando...';

    try {
      const res  = await apiFetch(url, body);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || JSON.stringify(data));
      mostrarResultado(data);
    } catch (e) {
      showErr(e.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-calculator me-2"></i>Calcular precio';
    }
  }

  function showErr(msg) {
    const el = document.getElementById('form-error');
    el.textContent   = msg;
    el.style.display = 'block';
  }

  // ── Mostrar resultado ────────────────────────────────────
  function cop(n) {
    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP',
                                            maximumFractionDigits: 0 }).format(n);
  }

  function mostrarResultado(d) {
    const panel  = document.getElementById('result-panel');
    const grid   = document.getElementById('result-grid');
    const diff   = document.getElementById('catalogo-diff');

    // La API devuelve: d.inputs / d.desglose / d.resultado / d.escala (lote)
    const inp  = d.inputs    || {};
    const des  = d.desglose  || {};
    const res  = d.resultado || {};
    const esc  = d.escala    || null;

    const campos = esc ? [
      { label: 'Nombre',             value: inp.nombre_pieza || '—',        highlight: false },
      { label: 'Cantidad',           value: `${esc.cantidad} uds`,          highlight: false },
      { label: 'Costo material',     value: cop(des.costo_material),        highlight: false },
      { label: 'Costo energía',      value: cop(des.costo_energia),         highlight: false },
      { label: 'Costo tiempo',       value: cop(des.costo_tiempo),          highlight: false },
      { label: 'Subtotal producción',value: cop(des.subtotal_produccion),   highlight: false },
      { label: 'Costo total (lote)', value: cop(esc.costo_total_lote),      highlight: false },
      { label: 'Precio LOTE',        value: cop(esc.precio_total_lote),     highlight: true  },
      { label: 'Precio por unidad',  value: cop(res.precio_venta_sugerido), highlight: true  },
    ] : [
      { label: 'Nombre',             value: inp.nombre_pieza || '—',        highlight: false },
      { label: 'Costo material',     value: cop(des.costo_material),        highlight: false },
      { label: 'Costo energía',      value: cop(des.costo_energia),         highlight: false },
      { label: 'Costo tiempo',       value: cop(des.costo_tiempo),          highlight: false },
      { label: 'Subtotal producción',value: cop(des.subtotal_produccion),   highlight: false },
      { label: 'Amort. fallos',      value: cop(des.amortizacion_fallos),   highlight: false },
      { label: 'Depreciación',       value: cop(des.depreciacion_pieza),    highlight: false },
      { label: 'Mantenimiento',      value: cop(des.mantenimiento_preventivo), highlight: false },
      { label: 'Costo total real',   value: cop(res.costo_total_real),      highlight: false },
      { label: 'Precio de venta',    value: cop(res.precio_venta_sugerido), highlight: true  },
    ];

    grid.innerHTML = campos.map(c => `
      <div class="result-item ${c.highlight ? 'highlight' : ''}">
        <div class="label">${c.label}</div>
        <div class="value">${c.value}</div>
      </div>
    `).join('');

    // Diferencia catálogo
    if (d.pieza_catalogo && d.pieza_catalogo.diferencia_precio != null) {
      const dif   = d.pieza_catalogo.diferencia_precio;
      const signo = dif >= 0 ? '+' : '';
      diff.style.display = 'block';
      document.getElementById('catalogo-diff-text').innerHTML =
        `<i class="bi bi-info-circle me-2"></i>
         Precio guardado en catálogo: <strong>${cop(d.pieza_catalogo.precio_guardado)}</strong> &nbsp;|&nbsp;
         Diferencia con recálculo: <strong>${signo}${cop(dif)}</strong>`;
    } else {
      diff.style.display = 'none';
    }

    lastResult = d;
    document.getElementById('save-feedback').style.display = 'none';
    const btnG = document.getElementById('btn-guardar');
    btnG.disabled = !accessToken;
    btnG.innerHTML = '<i class="bi bi-floppy me-2"></i>Guardar en piezas';
    btnG.style.background = 'var(--success)';
    actualizarEstadoAuth();

    panel.style.display = 'block';
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Guardar en piezas ─────────────────────────────
  async function guardarEnInventario() {
    if (!lastResult) return;

    const inp = lastResult.inputs   || {};
    const des = lastResult.desglose || {};
    const res = lastResult.resultado || {};
    const btn = document.getElementById('btn-guardar');
    const fb  = document.getElementById('save-feedback');

    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin me-2"></i>Guardando...';
    fb.style.display = 'none';

    const payload = {
      nombre:                   inp.nombre_pieza             || 'Sin nombre',
      peso_gramos:              inp.peso_gramos              || 0,
      tiempo_impresion_horas:   inp.tiempo_impresion_horas   || 0,
      tiempo_postproceso_horas: inp.tiempo_postproceso_horas || 0,
      costo_empaque:            des.costo_empaque            || 0,
      costo_material:           des.costo_material           || 0,
      costo_energia:            des.costo_energia            || 0,
      costo_tiempo:             des.costo_tiempo             || 0,
      subtotal_produccion:      des.subtotal_produccion      || 0,
      amortizacion_fallos:      des.amortizacion_fallos      || 0,
      depreciacion_pieza:       des.depreciacion_pieza       || 0,
      mantenimiento_preventivo: des.mantenimiento_preventivo || 0,
      costo_total_real:         res.costo_total_real         || 0,
      precio_venta_sugerido:    res.precio_venta_sugerido    || 0,
    };

    try {
      const r = await apiFetch(`${BASE}/api/v1/piezas/`, payload);
      const data = await r.json();
      if (!r.ok) throw new Error(JSON.stringify(data));

      fb.className   = 'alert-dark-info';
      fb.innerHTML   = `<i class="bi bi-check-circle me-2"></i>Guardado en piezas con ID <strong>#${data.id}</strong>`;
      fb.style.display = 'block';
      btn.innerHTML  = '<i class="bi bi-check-lg me-2"></i>Guardado';
      btn.style.background = '#16a34a';
      cargarCatalogo();
    } catch (e) {
      fb.className   = 'alert-dark-danger';
      fb.innerHTML   = `<i class="bi bi-x-circle me-2"></i>${e.message}`;
      fb.style.display = 'block';
      btn.disabled   = false;
      btn.innerHTML  = '<i class="bi bi-floppy me-2"></i>Guardar en piezas';
      btn.style.background = 'var(--success)';
    }
  }
</script>
</body>
</html>
