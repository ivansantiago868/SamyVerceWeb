app = "samyverceweb"
primary_region = "gru"

[build]

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.production"
  SQLITE_PATH = "/data/db.sqlite3"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "samyverceweb_data"
  destination = "/data"

[[statics]]
  guest_path = "/app/staticfiles"
  url_prefix = "/static/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
